<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptic</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <svg class="logo" viewBox="0 0 16 16" width="48" height="48" aria-hidden="true"><path fill="currentColor" d="M8 0l7 4v8l-7 4-7-4V4l7-4zm0 2.3L3 5.2v5.6l5 2.9 5-2.9V5.2L8 2.3z"/></svg>
      <h1>Sign in to Cryptic</h1>
      <div id="google-btn-container" class="google-btn-container"></div>
      <div id="auth-config-warning" class="flash flash-warn hidden">
        Server isn't configured yet. Set <code>GOOGLE_CLIENT_ID</code>, <code>ADMIN_MAIL</code> and <code>SESSION_SECRET</code> in Cloudflare.
      </div>
      <div id="auth-error" class="flash flash-error hidden"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <svg class="logo" viewBox="0 0 16 16" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M8 0l7 4v8l-7 4-7-4V4l7-4zm0 2.3L3 5.2v5.6l5 2.9 5-2.9V5.2L8 2.3z"/></svg>
        <span class="topbar-title">Cryptic</span>
      </div>
      <div class="topbar-right">
        <span id="nav-email" class="muted"></span>
        <button class="btn btn-sm" id="logout-btn">Sign out</button>
      </div>
    </header>

    <div class="repo-head">
      <div class="repo-title">
        <svg viewBox="0 0 16 16" width="16" height="16" class="muted"><path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
        <span id="repo-owner" class="repo-owner">Cryptic</span>
        <span class="muted">/</span>
        <strong class="repo-name">scripts</strong>
        <span class="badge">Private</span>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">Files</div>
        <div id="tree" class="tree"></div>
      </aside>

      <main class="main" id="main">
        <div class="pathbar">
          <nav id="breadcrumbs" class="breadcrumbs"></nav>
          <div class="pathbar-actions" id="pathbar-actions"></div>
        </div>

        <div id="content"></div>
      </main>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-box">Drop files or folders to upload</div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container"></div>
  <input type="file" id="file-input" multiple hidden>

  <script src="lua.js"></script>
  <script src="app.js"></script>
</body>
</html>
